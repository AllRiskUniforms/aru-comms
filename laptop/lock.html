<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <title>ARU 98</title>
  <style>
:root {
  --green: #00ff5f;
  --w98-face: #c0c0c0;
  --w98-shadow: #808080;
  --w98-dark: #000;
  --w98-light: #fff;
  --w98-blue: #000080;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: #000; color: var(--green); overflow: hidden; cursor: default; user-select: none; }
#matrix { position: fixed; inset: 0; z-index: 0; display: block; }
.stage { position: fixed; inset: 0; z-index: 1; display: flex; align-items: center; justify-content: center; padding: 16px; }
[hidden] { display: none !important; }

/* ── Boot / loading ────────────────────────────────────────────────────────── */
#boot { background: rgba(0,0,0,0.55); flex-direction: column; font-family: "Lucida Console", Consolas, "Courier New", monospace; }
#boot-text { font-size: clamp(18px, 3vw, 34px); min-height: 1.4em; text-shadow: 0 0 8px var(--green); white-space: pre; }
#boot-text::after { content: "█"; animation: blink 1s steps(1) infinite; margin-left: 2px; }
@keyframes blink { 50% { opacity: 0; } }
#loading { margin-top: 28px; width: min(560px, 90vw); font-size: 14px; }
#loading[hidden] { display: none; }
#load-log { white-space: pre; line-height: 1.5; min-height: 6em; opacity: 0.85; }
.bar { border: 1px solid var(--green); height: 18px; padding: 2px; margin-top: 8px; box-shadow: 0 0 8px #00ff5f55; }
.bar > div { height: 100%; width: 0; background: repeating-linear-gradient(90deg, var(--green) 0 10px, transparent 10px 12px); }
.skip { position: fixed; bottom: 14px; right: 18px; font-size: 12px; opacity: 0.5; }

/* ── Windows 98 logon dialog ───────────────────────────────────────────────── */
.win98 {
  background: var(--w98-face); color: #000;
  border: 2px solid; border-color: var(--w98-light) var(--w98-dark) var(--w98-dark) var(--w98-light);
  box-shadow: inset -1px -1px 0 var(--w98-shadow), inset 1px 1px 0 #dfdfdf, 4px 4px 0 #0008;
  font-family: Tahoma, "Microsoft Sans Serif", "MS Sans Serif", Geneva, sans-serif; font-size: 12px;
  padding: 2px;
}
.title-bar {
  background: linear-gradient(90deg, var(--w98-blue), #1084d0);
  color: #fff; display: flex; align-items: center; justify-content: space-between;
  padding: 2px 3px 2px 5px; font-weight: bold; height: 20px;
}
.title-bar-controls { display: flex; gap: 2px; }
.title-bar-controls span {
  width: 16px; height: 14px; background: var(--w98-face); color: #000;
  border: 1px solid; border-color: var(--w98-light) var(--w98-dark) var(--w98-dark) var(--w98-light);
  box-shadow: inset -1px -1px 0 var(--w98-shadow);
  font: bold 10px/11px Tahoma, sans-serif; text-align: center;
}
#logon { width: 420px; max-width: 100%; }
.logon-body { display: flex; gap: 14px; padding: 16px 12px 12px; }
.logon-body .icon { flex: none; padding-top: 2px; }
.logon-main { flex: 1; min-width: 0; }
.logon-main p { margin: 0 0 14px; }
.field { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.field label { width: 72px; flex: none; }
.field label u { text-decoration: underline; }
.field input {
  flex: 1; min-width: 0; height: 21px; padding: 2px 4px; font: inherit; color: #000; background: #fff;
  border: 2px solid; border-color: var(--w98-shadow) var(--w98-light) var(--w98-light) var(--w98-shadow);
  box-shadow: inset 1px 1px 0 var(--w98-dark); outline: none;
}
.buttons { display: flex; flex-direction: column; gap: 6px; padding-top: 1px; }
.w98btn {
  min-width: 75px; height: 23px; font: inherit; color: #000; cursor: pointer; background: var(--w98-face);
  border: 2px solid; border-color: var(--w98-light) var(--w98-dark) var(--w98-dark) var(--w98-light);
  box-shadow: inset -1px -1px 0 var(--w98-shadow);
}
.w98btn.default { outline: 1px solid #000; outline-offset: 0; }
.w98btn:active { border-color: var(--w98-dark) var(--w98-light) var(--w98-light) var(--w98-dark); box-shadow: inset 1px 1px 0 var(--w98-shadow); }
.w98btn:focus-visible { outline: 1px dotted #000; outline-offset: -5px; }
.shake { animation: shake 0.35s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }

#granted { font-family: "Lucida Console", Consolas, monospace; font-size: clamp(28px, 6vw, 72px); letter-spacing: 6px; text-shadow: 0 0 16px var(--green); background: rgba(0,0,0,0.6); }

/* ── Nedry ─────────────────────────────────────────────────────────────────── */
#nedry { z-index: 5; background: #000; }
#magic {
  position: absolute; inset: 0; margin: 0; padding: 12px 16px; overflow: hidden;
  font: 16px/1.25 "Lucida Console", Consolas, "Courier New", monospace; color: #e8e8e8;
  display: flex; flex-direction: column; justify-content: flex-end; white-space: pre;
}
#nedry-win { position: relative; }
#nedry-screen { background: #fff; overflow: hidden; border: 2px solid; border-color: var(--w98-shadow) var(--w98-light) var(--w98-light) var(--w98-shadow); }
/* Nedry is three cut-outs (see nedry/LICENSE); fitNedry() scales the 440x540 figure. */
.nedry-fig { position: relative; width: 440px; height: 540px; transform-origin: 0 0; }
.nedry-fig img { position: absolute; top: 0; left: 0; }
.nedry-fig .head { top: 35px; left: 140px; }
.nedry-fig .hand { top: 155px; left: 265px; transform-origin: 50% 100%; animation: wag 0.7s linear infinite; }
@keyframes wag { 0%, 100% { transform: rotate(-10deg); } 50% { transform: rotate(14deg); } }
#nedry-hint { position: absolute; bottom: 16px; left: 0; right: 0; text-align: center; color: #9a9a9a; font: 13px Tahoma, sans-serif; }
  </style>
</head>
<body>
  <canvas id="matrix"></canvas>

  <!-- 1. Matrix boot sequence -->
  <div id="boot" class="stage">
    <div id="boot-text"></div>
    <div id="loading" hidden>
      <div id="load-log"></div>
      <div class="bar"><div id="load-bar"></div></div>
    </div>
    <div class="skip">press any key to skip</div>
  </div>

  <!-- 2. Windows 98 style logon -->
  <div id="dialog" class="stage" hidden>
    <form id="logon" class="win98" autocomplete="off">
      <div class="title-bar">
        <span>Welcome to ARU 98</span>
        <span class="title-bar-controls"><span>?</span><span>×</span></span>
      </div>
      <div class="logon-body">
        <div class="icon" id="key-icon"></div>
        <div class="logon-main">
          <p id="logon-msg"></p>
          <div class="field" data-mode="password"><label for="user"><u>U</u>ser name:</label><input id="user" value="ARU" spellcheck="false" /></div>
          <div class="field" data-mode="password"><label for="pass"><u>P</u>assword:</label><input id="pass" type="password" spellcheck="false" /></div>
          <div class="field" data-mode="recover"><label for="phrase">P<u>a</u>ssphrase:</label><input id="phrase" type="password" spellcheck="false" /></div>
          <div class="field" data-mode="recover"><label for="phone">P<u>h</u>one:</label><input id="phone" type="tel" spellcheck="false" /></div>
        </div>
        <div class="buttons">
          <button class="w98btn default" type="submit">OK</button>
          <button class="w98btn" type="button" id="cancel">Cancel</button>
          <button class="w98btn" type="button" id="forgot" data-mode="password">Forgot...</button>
        </div>
      </div>
    </form>
  </div>

  <div id="granted" class="stage" hidden>ACCESS GRANTED</div>

  <!-- 3. Wrong password -->
  <div id="nedry" class="stage" hidden>
    <pre id="magic"></pre>
    <div id="nedry-win" class="win98">
      <div class="title-bar"><span>nedry</span><span class="title-bar-controls"><span>×</span></span></div>
      <div id="nedry-screen">
        <div class="nedry-fig">
          <img src="nedry/body.png" alt="" />
          <img class="head" src="nedry/head.png" alt="Dennis Nedry" />
          <img class="hand" src="nedry/hand.png" alt="" />
        </div>
      </div>
    </div>
    <audio id="ahahah" src="nedry/ahahah.mp3" loop preload="auto"></audio>
    <div id="nedry-hint" hidden>press any key to try again</div>
  </div>

  <script>
// ARU 98 lock screen for the always-on home laptop. Matrix boot sequence, then a
// Windows-98 style logon. A wrong password gets Nedry wagging his finger.
//
// The password is stored as a salted SHA-256 hash so it isn't readable in this
// public repo. To change it, see laptop/README.md. If it's forgotten, "Forgot..."
// takes the ARU Comms passphrase plus the admin phone number instead
// (RECOVERY_HASH = sha256(SALT + passphrase + ':' + phone digits)).
const SALT = 'aru98:';
const PASS_HASH = 'fbecb728c065179d7e7cf1cff938e2397946fab476987bfb372d441b1a507ba3';
const RECOVERY_HASH = 'db0876adbe8ff57789271a52fcaf6120aaf1d833c7d675e22107c2209b1867c4';

const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

// ── Matrix rain ──────────────────────────────────────────────────────────────
(function () {
  const canvas = $('#matrix');
  const ctx = canvas.getContext('2d');
  const glyphs = '01ARU98ﾊﾐﾋｰｳｼﾅﾓﾆｻﾜｵﾘｱﾎﾃﾏｹﾒｴｶｷﾑﾕﾗｾﾈｽﾀﾇﾍ0123456789:.=*+-<>'.split('');
  let drops, fontSize;

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    fontSize = Math.max(14, Math.floor(window.innerWidth / 70));
    drops = new Array(Math.floor(canvas.width / fontSize)).fill(0).map(() => Math.random() * -60);
  }
  resize();
  window.addEventListener('resize', resize);

  setInterval(() => {
    ctx.fillStyle = 'rgba(0,0,0,0.07)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.font = fontSize + 'px monospace';
    for (let i = 0; i < drops.length; i++) {
      const ch = glyphs[(Math.random() * glyphs.length) | 0];
      ctx.fillStyle = Math.random() > 0.97 ? '#cfffdf' : '#00ff5f';
      ctx.fillText(ch, i * fontSize, drops[i] * fontSize);
      if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
  }, 50);
})();

// ── Boot sequence ────────────────────────────────────────────────────────────
let skipBoot = false;
async function typeLine(text, hold) {
  const el = $('#boot-text');
  el.textContent = '';
  for (const ch of text) {
    if (skipBoot) return;
    el.textContent += ch;
    await sleep(ch === '.' ? 160 : 70 + Math.random() * 60);
  }
  for (let t = 0; t < hold && !skipBoot; t += 50) await sleep(50);
}

async function boot() {
  for (const [line, hold] of [['Wake up, Tripp...', 1400], ['The Force has you...', 1400], ['Follow the pink rabbit.', 1200], ['Time to burn it all down.', 1400]]) {
    await typeLine(line, hold);
    if (skipBoot) break;
  }
  if (!skipBoot) {
    $('#boot-text').textContent = 'LOADING ARU 98';
    $('#loading').hidden = false;
    const steps = ['> mounting /dev/aru ........ OK', '> decrypting comms channel ... OK', '> syncing crew roster ....... OK', '> bypassing Nedry ........... ??'];
    for (let p = 0; p <= 100 && !skipBoot; p += 2) {
      $('#load-bar').style.width = p + '%';
      const shown = Math.floor((p / 100) * steps.length);
      $('#load-log').textContent = steps.slice(0, shown).join('\n');
      await sleep(45);
    }
  }
  showDialog();
}

function onSkip() { skipBoot = true; }
window.addEventListener('keydown', onSkip, { once: true });
window.addEventListener('pointerdown', onSkip, { once: true });

// ── Logon dialog ─────────────────────────────────────────────────────────────
function pixelIcon(rows, palette, scale) {
  let rects = '';
  rows.forEach((row, y) => [...row].forEach((c, x) => {
    if (palette[c]) rects += `<rect x="${x}" y="${y}" width="1" height="1" fill="${palette[c]}"/>`;
  }));
  return `<svg viewBox="0 0 ${rows[0].length} ${rows.length}" width="${rows[0].length * scale}" height="${rows.length * scale}" shape-rendering="crispEdges" aria-hidden="true">${rects}</svg>`;
}
$('#key-icon').innerHTML = pixelIcon([
  '..#####.........',
  '.#hhyyy#........',
  '#hy###yo#.......',
  '#y#...#yo#######',
  '#y#...#yhhhhhhh#',
  '#y#...#yyyyyyyo#',
  '#yo###oo####y#y#',
  '.#ooooo#...#o#o#',
  '..#####....#####',
], { '#': '#000', y: '#e0b030', h: '#fff2a0', o: '#8a6200' }, 3);

let dialogShown = false;
function showDialog() {
  if (dialogShown) return;
  dialogShown = true;
  $('#boot').hidden = true;
  $('#dialog').hidden = false;
  $('#pass').focus();
}

async function sha256Hex(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
}

let recovering = false;
function setMode(recover) {
  recovering = recover;
  $$('[data-mode="password"]').forEach((el) => { el.hidden = recover; });
  $$('[data-mode="recover"]').forEach((el) => { el.hidden = !recover; });
  $('#logon-msg').textContent = recover
    ? 'Forgot your password? Enter the ARU Comms passphrase and the admin phone number.'
    : 'Type your password to log on to ARU 98.';
  for (const id of ['#pass', '#phrase', '#phone']) $(id).value = '';
  (recover ? $('#phrase') : $('#pass')).focus();
}
setMode(false);

$('#logon').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!$('#nedry').hidden) return;
  const ok = recovering
    ? await sha256Hex(SALT + $('#phrase').value.trim().toLowerCase() + ':' + $('#phone').value.replace(/\D/g, '')) === RECOVERY_HASH
    : await sha256Hex(SALT + $('#pass').value.trim().toLowerCase()) === PASS_HASH;
  if (ok) {
    $('#dialog').hidden = true;
    $('#granted').hidden = false;
    await sleep(1200);
    // Closing this full-screen window uncovers the desktop, where everything kept
    // running. The title tells lock-watch.ps1 to close it if Edge won't let the page.
    document.title = 'ARU 98 unlocked';
    window.close();
    await sleep(6000);
    $('#granted').textContent = 'ACCESS GRANTED: press Alt+F4';
  } else {
    nedry();
  }
});
$('#cancel').onclick = () => setMode(false);
$('#forgot').onclick = () => setMode(true);

// ── Nedry ────────────────────────────────────────────────────────────────────
let nedryTimers = [];

function fitNedry() {
  const s = Math.min(1, (window.innerHeight * 0.8 - 30) / 540, (window.innerWidth * 0.9) / 440);
  $('.nedry-fig').style.transform = `scale(${s})`;
  $('#nedry-screen').style.width = 440 * s + 'px';
  $('#nedry-screen').style.height = 540 * s + 'px';
}
window.addEventListener('resize', fitNedry);

function nedry() {
  const magic = $('#magic');
  magic.textContent = '';
  $('#nedry').hidden = false;
  $('#nedry-hint').hidden = true;
  document.activeElement.blur();
  fitNedry();
  const ahahah = $('#ahahah');
  ahahah.currentTime = 0;
  ahahah.play().catch(() => {});

  // The terminal from the movie: three denials, then the magic word forever.
  const intro = ['> access main program', 'access: PERMISSION DENIED.', '> access security', 'access: PERMISSION DENIED.', '> access main security grid', 'access: PERMISSION DENIED....and....'];
  let n = 0;
  const lines = [];
  nedryTimers.push(setInterval(() => {
    lines.push(n < intro.length ? intro[n] : 'YOU DIDN\'T SAY THE MAGIC WORD!');
    n++;
    if (lines.length > 80) lines.shift();
    magic.textContent = lines.join('\n');
  }, 140));

  nedryTimers.push(setTimeout(() => {
    $('#nedry-hint').hidden = false;
    window.addEventListener('keydown', closeNedry, { once: true });
    window.addEventListener('pointerdown', closeNedry, { once: true });
  }, 4000));
}

function closeNedry(e) {
  if (e) e.preventDefault();
  window.removeEventListener('keydown', closeNedry);
  window.removeEventListener('pointerdown', closeNedry);
  nedryTimers.forEach((t) => { clearTimeout(t); clearInterval(t); });
  nedryTimers = [];
  $('#ahahah').pause();
  $('#nedry').hidden = true;
  const form = $('#logon');
  form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
  setMode(recovering);
}

boot();
  </script>
</body>
</html>
